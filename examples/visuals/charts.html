<style>main{padding:18px;max-width:728px;margin:auto}h2{margin:0 0 8px}p{color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap}button{padding:8px;color:var(--foreground);background:var(--background);border:1px solid var(--border);border-radius:6px}button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}svg{display:block;width:100%;margin-top:16px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border)}summary{cursor:pointer;padding:12px 0}</style>
<main><h2>Haftanın görünümü</h2><p>Örnek veridir; gerçek hesap veya kullanım bilgisi içermez.</p><nav aria-label="Grafik metriği"><button data-metric="tasks" aria-pressed="true">Tamamlanan işler</button><button data-metric="minutes" aria-pressed="false">Çalışma süresi</button></nav><p id="summary" aria-live="polite"></p><svg viewBox="0 0 600 280" role="img" aria-label="Haftalık sütun grafiği"></svg><details><summary>Veri tablosu</summary><table><thead><tr><th>Gün</th><th id="unit">İş</th></tr></thead><tbody></tbody></table></details></main>
<script>
const days=['Pzt','Sal','Çar','Per','Cum'],data={tasks:[4,7,3,9,6],minutes:[35,80,45,110,65]};function render(metric){const values=data[metric],max=Math.max(...values),unit=metric==='tasks'?'iş':'dakika';document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.metric===metric)));document.querySelector('#summary').textContent=`Toplam ${values.reduce((a,b)=>a+b,0)} ${unit}`;document.querySelector('#unit').textContent=unit;document.querySelector('svg').innerHTML=values.map((v,i)=>{const h=v/max*180;return `<g><rect x="${i*115+25}" y="${220-h}" width="65" height="${h}" rx="4" fill="var(--accent)"><title>${days[i]}: ${v} ${unit}</title></rect><text x="${i*115+57}" y="${210-h}" text-anchor="middle" fill="var(--foreground)">${v}</text><text x="${i*115+57}" y="250" text-anchor="middle" fill="var(--muted)">${days[i]}</text></g>`}).join('');document.querySelector('tbody').innerHTML=values.map((v,i)=>`<tr><td>${days[i]}</td><td>${v}</td></tr>`).join('')};document.querySelectorAll('button').forEach(b=>b.onclick=()=>render(b.dataset.metric));render('tasks');
</script>
